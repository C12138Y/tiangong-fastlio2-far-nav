/my_nav/local_costmap:
  ros__parameters:
    use_sim_time: false

    # FAST-LIO2 独立坐标系
    global_frame: fastlio_odom
    robot_base_frame: my_nav_base_link

    rolling_window: true
    width: 12
    height: 12
    resolution: 0.10

    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.3
    initial_transform_timeout: 10.0

    # 目前仅用于影子测试，后续根据天工实际占地调整
    robot_radius: 0.35
    footprint_padding: 0.05

    track_unknown_space: false
    always_send_full_costmap: true

    plugins:
      - voxel_layer
      - inflation_layer

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true

      # 建立 0～2m 高度的三维体素空间
      origin_z: 0.0
      z_resolution: 0.125
      z_voxels: 16

      publish_voxel_map: true
      footprint_clearing_enabled: true

      unknown_threshold: 15
      mark_threshold: 0
      combination_method: 1

      observation_sources: fastlio_cloud

      fastlio_cloud:
        topic: /fastlio2/body_cloud
        data_type: "PointCloud2"
        sensor_frame: fastlio_body

        marking: true
        clearing: true

        # 先排除贴近地面的点，防止地板被识别成障碍物
        min_obstacle_height: 0.08
        max_obstacle_height: 1.80

        obstacle_min_range: 0.30
        obstacle_max_range: 8.0
        raytrace_min_range: 0.30
        raytrace_max_range: 10.0

        observation_persistence: 0.0
        expected_update_rate: 0.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.55
      cost_scaling_factor: 4.0